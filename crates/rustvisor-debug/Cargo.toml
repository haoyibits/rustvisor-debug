[package]
name = "rustvisor-debug"
description = "Debugging front end for the rustvisor hypervisor (TRACE32 or StellarLINK backend)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rustvisor-debug"
path = "src/main.rs"

[dependencies]
probecore = { path = "../probecore" }
stellarbridge = { path = "../stellarbridge" }
tracebridge = { path = "../tracebridge" }

[dev-dependencies]
serde_json = "1.0"
