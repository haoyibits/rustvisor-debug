name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          export TRACEBRIDGE_GIT_HASH="${GITHUB_SHA::10}"
          cargo build --release --locked --target ${{ matrix.target }} -p tracebridge -p rustvisor-debug
      - name: Check that Linux binaries are static
        if: contains(matrix.target, 'musl')
        run: |
          for program in tracebridge rvdbg; do
            file target/${{ matrix.target }}/release/$program
            ! ldd target/${{ matrix.target }}/release/$program 2>/dev/null | grep -q '=>'
          done
      - name: Package
        shell: bash
        run: |
          # One archive per program: tracebridge (TRACE32 only) and rvdbg
          # (rustvisor's front end for TRACE32 and StellarLINK).
          for program in tracebridge rvdbg; do
            name=$program-${{ matrix.target }}
            mkdir -p dist/$name
            cp target/${{ matrix.target }}/release/$program README.md LICENSE NOTICE dist/$name/
            tar -C dist -czf dist/$name.tar.gz $name
            (
              cd dist
              if command -v sha256sum >/dev/null; then
                sha256sum $name.tar.gz > $name.tar.gz.sha256
              else
                shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
              fi
            )
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Homebrew bottles
        run: |
          packaging/homebrew/bottles.sh "${GITHUB_REF_NAME#v}" dist tracebridge
          packaging/homebrew/bottles.sh "${GITHUB_REF_NAME#v}" dist rvdbg
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* install.sh \
            --title "tracebridge and rvdbg ${GITHUB_REF_NAME}" --generate-notes

