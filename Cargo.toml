[workspace]
resolver = "3"
members = [
    "crates/fdx-oracle",
    "crates/oocd",
    "crates/probecore",
    "crates/rustvisor-debug",
    "crates/stellarbridge",
    "crates/t32rcl",
    "crates/tracebridge",
]

[workspace.package]
version = "0.1.23"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/haoyibits/rustvisor-debug"

[profile.release]
lto = true
codegen-units = 1
strip = true
