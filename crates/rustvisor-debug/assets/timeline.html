<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM State Timeline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap">
<style>
/* Template: timeline.py fills #timeline-data; without it the page fetches ?data=FILE (default timeline.json).
   Rows by exception level: EL1 (what the guest runs: code, ISR, IPC write/read) on top, EL2 (by exit reason) below,
   Pending (interrupt raised, EL2 not yet entered) under it when recorded. Style follows haoyichen.com: cream page, navy
   outlines; orange for ISR and selection only; ochre only for small labels. */
:root {
  --bg: #F5F1E9; --surface: #FFFFFF; --ink: #012247; --muted: #5C6673; --label: #8F6114; --line: #D5CEC0; --track: #F5F1E9; --edge: #012247;
  --sel: #D8471E; --step: #012247;
  --el1: #2E7A5C; --el2: #012247; --el2-hvc: #4A7AB0; --isr: #D8471E; --ipc: #14707F; --hw: #7C8FA6;
  --shadow: rgba(1, 34, 71, .18);
  --font-body: "Plus Jakarta Sans", "PingFang SC", system-ui, sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1A2E; --surface: #11233A; --ink: #F5F1E9; --muted: #A3ABB5; --label: #D9AE62; --line: #2B3D55; --track: #182C45; --edge: #5A7192;
    --sel: #F08A5D; --step: #F5F1E9;
    --el1: #3F9A76; --el2: #5A86C4; --el2-hvc: #A3C4EA; --isr: #E5683F; --ipc: #2A9BAD; --hw: #8FA3BA;
    --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1A2E; --surface: #11233A; --ink: #F5F1E9; --muted: #A3ABB5; --label: #D9AE62; --line: #2B3D55; --track: #182C45; --edge: #5A7192;
  --sel: #F08A5D; --step: #F5F1E9;
  --el1: #3F9A76; --el2: #5A86C4; --el2-hvc: #A3C4EA; --isr: #E5683F; --ipc: #2A9BAD; --hw: #8FA3BA;
  --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; font-weight: 500; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 56px; }
main { max-width: 1120px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
h2 { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--label); }
p { margin: 0; max-width: 76ch; }
.lede { color: var(--muted); }
.top { display: grid; gap: 8px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); max-width: none; }
.meta > span { display: inline-flex; align-items: center; gap: 7px; }
.label { display: inline-block; white-space: nowrap; flex: none; border: 1.5px solid var(--label); border-radius: 6px; padding: 0 6px; color: var(--label);
  font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; line-height: 1.6; }
.label.warn { border-color: var(--sel); color: var(--sel); }
.panel { background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 16px 18px; display: grid; gap: 12px; min-width: 0; }
/* controls: one row per group, labels in a fixed column */
.ctl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px 14px; align-items: center; }
.crow { display: contents; }
.cv { display: grid; gap: 4px; min-width: 0; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.lbl { color: var(--label); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.runnote { font-size: 13px; color: var(--muted); }
button { font: inherit; font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 10px; border: 2px solid var(--edge); background: transparent; color: var(--ink); cursor: pointer; }
button:hover { background: var(--bg); }
button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
button:focus-visible, .chip:focus-within { outline: 2px solid var(--sel); outline-offset: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer; user-select: none; font-size: 13px; font-weight: 600; }
.chip.mono { font-family: var(--font-mono); font-weight: 500; }
.chip input { margin: 0; accent-color: var(--ink); }
.chip:has(input:checked) { border-color: var(--edge); }
.hint { color: var(--muted); font-size: 12px; }
.chart { position: relative; min-width: 0; }
.chart canvas { display: block; width: 100%; }
#main { cursor: grab; }
#main.dragging { cursor: grabbing; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 10px; border-top: 1px solid var(--line); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
.sw.outline { background: var(--surface) !important; box-shadow: inset 0 0 0 1.6px var(--ipc); }
.sw.thin { height: 5px; }
.donut { display: grid; justify-items: center; gap: 4px; }
.dcap { font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
.card { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 10px 14px; align-items: center; min-width: 0; }
.card h3 { grid-column: 1 / -1; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.card h3 small { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--muted); border: 1.5px solid var(--line); border-radius: 7px; padding: 0 6px; }
.card .rows { grid-column: 2; display: grid; gap: 3px; font-size: 12px; min-width: 0; }
.card.wide .rows { grid-column: 1 / -1; }
.rows div { display: grid; grid-template-columns: 12px 1fr auto; gap: 6px; align-items: baseline; }
.rows .muted { color: var(--muted); grid-template-columns: 1fr; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--label); font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 2px solid var(--line); }
.tablewrap { overflow-x: auto; }
.yes { color: var(--el1); font-weight: 700; }
.no { color: var(--sel); font-weight: 700; }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); color: var(--ink); border: 2px solid var(--edge);
  border-radius: 10px; padding: 7px 10px; font-size: 12px; line-height: 1.5; max-width: 280px; }
/* floating details */
#pop { position: fixed; z-index: 30; width: min(360px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
  background: var(--surface); color: var(--ink); border: 2px solid var(--edge); border-top: 5px solid var(--sel); border-radius: 14px;
  box-shadow: 0 10px 28px var(--shadow); padding: 0 14px 14px; }
.pophead { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: move; padding: 8px 0 6px; user-select: none; touch-action: none;
  position: sticky; top: 0; background: var(--surface); }
.pophead button { border: none; padding: 0 6px; font-size: 20px; line-height: 1; font-weight: 600; }
#details dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 13px; }
#details dt { color: var(--label); font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding-top: 2px; }
#details dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
#details h4 { margin: 10px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--label); }
.stages { display: grid; grid-template-columns: 12px auto 1fr auto; gap: 3px 8px; font-size: 12.5px; align-items: baseline; }
.stages .where { font-family: var(--font-mono); color: var(--muted); font-size: 11.5px; }
.total { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.note { margin-top: 8px; line-height: 1.45; }
details.note summary { cursor: pointer; color: var(--label); font-weight: 700; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
details.note[open] summary { margin-bottom: 4px; }
@media (max-width: 600px) {
  .ctl { grid-template-columns: 1fr; gap: 4px; }
  .crow > .lbl { margin-top: 6px; }
  #pop { left: 8px !important; right: 8px; top: auto !important; bottom: 8px; width: auto; max-height: 55vh; }
}
</style>

<main>
  <header class="top">
    <h1 id="title">VM State Timeline</h1>
    <p class="lede" id="lede"></p>
    <p class="meta" id="meta"></p>
  </header>

  <div class="panel">
    <div class="ctl">
      <div class="crow"><span class="lbl">Recording</span><div class="cv"><div class="group" id="runs" role="group" aria-label="Recording"></div><p class="runnote" id="runNote"></p></div></div>
      <div class="crow"><span class="lbl">Panels</span><div class="group" role="group" aria-label="Panels">
        <button type="button" id="modeVm" aria-pressed="true">By VM</button>
        <button type="button" id="modeCore" aria-pressed="false">By core</button></div></div>
      <div class="crow"><span class="lbl">Show</span><div class="group" id="units" role="group" aria-label="Show"></div></div>
      <div class="crow" id="presetRow"><span class="lbl">Presets</span><div class="group" id="presets" role="group" aria-label="Presets"></div></div>
      <div class="crow"><span class="lbl">Time</span><div class="group">
        <button type="button" id="zoomIn">Zoom in</button>
        <button type="button" id="zoomOut">Zoom out</button>
        <button type="button" id="nextBurst">Next burst</button>
        <button type="button" id="fitRun">Whole run</button></div></div>
      <div class="crow" id="optRow"><span class="lbl">Options</span><div class="group">
        <label class="chip" id="linksChip"><input type="checkbox" id="links" checked>IPC links</label>
        <label class="chip" id="pendChip"><input type="checkbox" id="pendRow">Pending row</label></div></div>
    </div>
    <p class="hint">Drag to pan · ⌘/ctrl/alt + wheel or pinch to zoom · click a block for details</p>
    <div class="chart" id="ovBox"><canvas id="ov" aria-label="Whole recording; drag to choose the window"></canvas></div>
    <div class="chart" id="mainBox"><canvas id="main" role="img" aria-label="State timeline of the selected VMs"></canvas></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="panel"><h2 id="sumTitle">In the window</h2><div class="cards" id="cards"></div></div>

  <div class="panel" id="about" hidden>
    <h2 id="covTitle"></h2>
    <div class="tablewrap" id="covBox"></div>
    <p class="hint" id="footnote"></p>
  </div>
</main>
<div id="tip" hidden></div>
<div id="pop" role="dialog" aria-label="Details" hidden>
  <div class="pophead" id="popHead"><span class="lbl">Details</span><button type="button" id="popClose" aria-label="Close details">×</button></div>
  <div id="details"></div>
</div>

<script id="timeline-data" type="application/json">null</script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let C = {};
function readColors() {
  C = {}; for (const k of ["bg", "surface", "ink", "muted", "label", "line", "track", "sel", "step", "el1", "el2", "el2-hvc", "isr", "ipc", "hw", "font-mono", "font-body"]) C[k] = css("--" + k);
}
// text on a filled block: navy on light fills, white on dark ones
function textOn(col) {
  const m = /^#([0-9a-f]{6})$/i.exec(col); if (!m) return "#FFFFFF";
  const n = parseInt(m[1], 16), L = (0.2126 * (n >> 16 & 255) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255;
  return L > 0.5 ? "#012247" : "#FFFFFF";
}
const DIRNAME = d => "0x" + d.toString(16).padStart(2, "0").toUpperCase();
function fmt(ns) {
  const a = Math.abs(ns);
  if (a < 1e3) return ns.toFixed(0) + " ns";
  if (a < 1e6) return (ns / 1e3).toFixed(2) + " µs";
  if (a < 1e9) return (ns / 1e6).toFixed(3) + " ms";
  return (ns / 1e9).toFixed(6) + " s";
}
function median(a) { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); return s[Math.floor((s.length - 1) / 2)]; }
const sum = a => a.reduce((s, x) => s + x, 0);

// ---------------- data (format rustvisor-timeline/3, see README.md) ----------------
const FORMAT = "rustvisor-timeline/3";
const ROWNAME = { el1: "EL1", el2: "EL2", pend: "PENDING" };
const VIA = { hvc: "HVC", IRQ: "IRQ", SGI: "SGI request", notice: "notice" };
const VIA_LONG = { hvc: "HVC", IRQ: "IRQ (physical interrupt)", SGI: "SGI request (the guest wrote ICC_SGI1R, trapped)", notice: "notice (FIQ from another core's EL2)" };
let DOC = null, RUNS = {};
function prepare(doc) {
  for (const r of doc.runs) {
    RUNS[r.key] = r;
    r.byVm = {};
    const kinds = new Set(), reasons = new Set();
    let hasPend = false;
    r.units.forEach(u => {
      r.byVm[u.vm] = u;
      u.segs = u.segs.map((g, i) => {
        const x = g[4] || {}, lv = g[2];
        if (lv === "el2") reasons.add(g[3]); else kinds.add(lv === "unknown" ? "unknown" : g[3]);
        const parts = (x.parts || []).map(p => { kinds.add(p[2]); return { s: p[0], e: p[1], kind: p[2] }; });
        return { s: g[0], e: g[1], lv, kind: g[3] || "", vec: x.vec, detail: x.detail || "", name: x.name || "", op: x.op || "", sent: x.sent, parts, msg: x.msg, id: u.vm + ":" + i, u: u.vm, row: lv === "el2" ? "el2" : "el1" };
      });
      u.pend = (u.pending || []).map((h, i) => { hasPend = true; const x = h[3] || {}; return { s: h[0], e: h[1], lv: "pend", kind: h[2], msg: x.msg, id: u.vm + ":p" + i, u: u.vm, row: "pend" }; });
      // the part of a pending interval this core spent in EL2 (interrupts masked): the carrier waited for its eret
      for (const p of u.pend) p.waits = u.segs.filter(g => g.lv === "el2" && g.e > p.s && g.s < p.e).map(g => ({ s: Math.max(g.s, p.s), e: Math.min(g.e, p.e) }));
      u.events = [];
    });
    r.kinds = kinds;
    r.hasWait = r.units.some(u => u.pend.some(p => p.waits.length));
    r.spans = kinds.has("ipc-write") || kinds.has("ipc-read");   // IPC code recorded as blocks
    r.reasons = [...reasons].sort((a, b) => (a === "hvc") - (b === "hvc") || a.localeCompare(b));
    r.hasPend = hasPend;
    r.baseRows = ["el1"].concat(reasons.size ? ["el2"] : []);
    r.rows = rowsFor(r);
    r.msgs = r.msgs.map((m, i) => ({ id: i, dir: m[0], seq: m[1], from: m[2], to: m[3], s: m[4], r: m[5], lat: m[5] - m[4] }));
    for (const m of r.msgs) {
      if (r.byVm[m.from]) r.byVm[m.from].events.push({ t: m.s, kind: "send", peer: m.to, msg: m });
      if (r.byVm[m.to]) r.byVm[m.to].events.push({ t: m.r, kind: "recv", peer: m.from, msg: m });
    }
    // a message's chain: every block and pending interval that carries its index, in time order
    r.chain = {};
    for (const u of r.units) {
      u.events.sort((a, b) => a.t - b.t);
      for (const g of u.segs.concat(u.pend)) if (g.msg !== undefined) (r.chain[g.msg] = r.chain[g.msg] || []).push(g);
    }
    for (const k in r.chain) r.chain[k].sort((a, b) => a.s - b.s);
    // bursts: groups of activity other than plain EL1 code, separated by more than 5 ms
    const ts = [];
    for (const u of r.units) {
      for (const g of u.segs) if (!(g.lv === "el1" && g.kind === "app") && g.lv !== "unknown") ts.push([g.s, g.e]);
      for (const ev of u.events) ts.push([ev.t, ev.t]);
    }
    ts.sort((a, b) => a[0] - b[0]);
    r.bursts = [];
    for (const [s, e] of ts) {
      const last = r.bursts[r.bursts.length - 1];
      if (last && s - last.e < 5e6) { last.e = Math.max(last.e, e); last.n++; } else r.bursts.push({ s, e, n: 1 });
    }
    if (!r.bursts.length) r.bursts.push({ s: 0, e: r.span, n: 0 });
  }
}
// the Pending row only on request: by default pending shows as the links' horizontal part and timer markers
function rowsFor(r) { return r.baseRows.concat(S.showPend && r.hasPend ? ["pend"] : []); }
function defaultWindow(r) {
  if (r.window) return r.window;
  if (r.msgs.length) {
    const m = r.msgs.find(m => m.seq === 10) || r.msgs[0];
    return [m.s - 5000, m.s + 160000];
  }
  const b = r.bursts.reduce((x, y) => (y.n > x.n ? y : x));
  const pad = Math.max(2e5, (b.e - b.s) * 0.05);
  return [b.s - pad, b.e + pad];
}

// ---------------- state ----------------
const S = { run: null, mode: "vm", sel: null, a: 0, b: 1, links: true, showPend: false, pick: null };
const run = () => RUNS[S.run];
const byMode = (x, y) => (S.mode === "vm" ? x.vm.localeCompare(y.vm) : x.core.localeCompare(y.core));
function ordered() { return run().units.filter(u => S.sel.has(u.vm)).sort(byMode); }

// ---------------- items ----------------
function itemColor(g) {
  if (g.lv === "el2") return g.kind === "hvc" ? C["el2-hvc"] : C.el2;
  if (g.lv === "pend") return C.hw;
  if (g.kind === "isr") return C.isr;
  if (g.kind.startsWith("ipc")) return C.ipc;
  return C.el1;
}
const outlined = g => g.kind === "ipc-read";
// EL2 blocks say what EL2 does; the colour says how it was entered
const el2Label = g => g.op || { hvc: "hypercall", IRQ: "IRQ", SGI: "SGI request", notice: "notice" }[g.kind] || g.kind;
function itemLabel(g) {
  if (g.lv === "el2") return el2Label(g);
  if (g.lv === "pend") return g.kind;
  if (g.lv === "unknown") return "no records";
  if (g.kind === "isr") return g.name || "ISR";
  if (g.kind === "ipc-write") return "IPC write";
  if (g.kind === "ipc-read") return "IPC read";
  return S.mode === "core" ? g.u : "";
}
function itemName(g) {
  if (g.lv === "el2") return `EL2 · ${el2Label(g)}`;
  if (g.lv === "pend") return `Pending · ${g.kind}`;
  if (g.lv === "unknown") return "No records";
  if (g.kind === "isr") return `EL1 · ISR${g.name ? " " + g.name : ""}`;
  if (g.kind === "ipc-write") return "EL1 · IPC write (shared memory)";
  if (g.kind === "ipc-read") return "EL1 · IPC read (its ISR: IAR, read shared memory, EOI)";
  return "EL1 · code";
}
function picked(g) {
  if (!S.pick) return false;
  if (S.pick.msg !== undefined) return g.msg === S.pick.msg;
  return S.pick.item === g.id;
}
function findItem(id) { const r = run(), u = r.byVm[id.split(":")[0]]; return u.segs.concat(u.pend).find(g => g.id === id); }

// ---------------- layout ----------------
const LW = 74, RP = 12, HEAD = 24, RH = 28, RG = 5, PGAP = 16, TOP = 6, AX = 34;
const PH = () => HEAD + run().rows.length * (RH + RG) + PGAP;
let W = 800;
const X = t => LW + (t - S.a) / (S.b - S.a) * (W - LW - RP);
const Tm = x => S.a + (x - LW) / (W - LW - RP) * (S.b - S.a);
const rowTop = (p, r) => TOP + p * PH() + HEAD + r * (RH + RG);
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
function unitOf(step) { return step < 1e3 ? [1, "ns"] : step < 1e6 ? [1e3, "µs"] : step < 1e9 ? [1e6, "ms"] : [1e9, "s"]; }
function sizeCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1, w = Math.max(320, cv.parentElement.clientWidth);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + "px";
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return [ctx, w];
}
let hatch = null, stripes = null;
function makeStripes(ctx) {

const swOf = g => sw(g.lv === "pend" ? "--hw" : g.lv === "el2" ? (g.kind === "hvc" ? "--el2-hvc" : "--el2") : g.kind === "isr" ? "--isr" : g.kind === "app" ? "--el1" : "--ipc", outlined(g) ? "outline" : g.lv === "pend" ? "thin" : "");

// screen box of what the pick highlights (the clicked block, or every block of the message in the shown panels)

// ---------------- hit testing ----------------
function hit(x, y) {

let raf = 0;
function renderView() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; renderOverview(); renderMain(); renderCards(); }); }
const sameSet = (a, b) => a.length === b.size && a.every(x => b.has(x));
function renderChips() {

function setup() {

  $("#presets").addEventListener("click", ev => { const i = ev.target.dataset.preset; if (i === undefined) return; S.sel = new Set(run().presets[i].units); renderAll(); });

function start(doc) {

(() => {
  const fail = (src, e) => { $("#cards").innerHTML = `<p class="empty">The data ${esc(src)} did not load (${esc(e.message)}).</p>`; };
