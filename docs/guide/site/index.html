<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rvdbg 使用手册 / User Guide</title>
<style>
  :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --line: #d1d9e0; --link: #0969da; --bg: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --link: #4493f8; --bg: #0d1117; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
  main { max-width: 34rem; margin: 18vh auto 0; padding: 0 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  a.book { display: block; padding: .9rem 1rem; margin-bottom: .75rem; border: 1px solid var(--line);
           border-radius: 8px; color: var(--link); text-decoration: none; font-size: 1.1rem; }
  a.book:hover { border-color: var(--link); }
  a.book span { display: block; color: var(--muted); font-size: .9rem; }
</style>

<main>
<h1>rvdbg</h1>
<p>rustvisor 板卡的烧录、调试与检查工具 · Flash, debug and inspect rustvisor boards</p>
<a class="book" href="/cn/">中文手册<span>安装、配置、烧录、调试、诊断、通信与自动化</span></a>
