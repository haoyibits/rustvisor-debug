[package]
name = "rustvisor-debug"
description = "Debugging front end for the rustvisor hypervisor (TRACE32 or StellarLINK backend)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rvdbg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
toml = "1.1"
probecore = { path = "../probecore" }
serde_json = { version = "1.0", features = ["preserve_order"] }
stellarbridge = { path = "../stellarbridge" }
tracebridge = { path = "../tracebridge" }
# The interactive session: line editing and history, like tracebridge's.
rustyline = { version = "18.0", default-features = false, features = ["with-file-history"] }

[target.'cfg(unix)'.dependencies]
# Ctrl-C stops a command in the session, not rvdbg (safe API, no unsafe).
signal-hook = "0.4.4"

[dev-dependencies]
tempfile = "3.27"
