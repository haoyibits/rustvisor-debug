[book]
title = "rvdbg 使用手册 / User Guide"
authors = ["rustvisor-debug contributors"]
language = "zh-CN"
src = "."

[build]
build-dir = "../../target/guide"
create-missing = false

[preprocessor.backlinks]
command = "python3 ../../tools/docs/links.py"
after = ["links", "index"]
renderers = ["html"]

[output.html]
git-repository-url = "https://github.com/haoyibits/rustvisor-debug"
edit-url-template = "https://github.com/haoyibits/rustvisor-debug/edit/main/docs/guide/{path}"

# Keep source links to README.md working after the index preprocessor renames it.
[output.html.redirect]
"README.html" = "index.html"
"en/README.html" = "index.html"
"cn/README.html" = "index.html"
"automation.html" = "cn/automation.html"
"channels.html" = "cn/channels.html"
"configuration.html" = "cn/configuration.html"
"debugging.html" = "cn/debugging.html"
"flashing.html" = "cn/flashing.html"
"inspection.html" = "cn/inspection.html"
"quickstart.html" = "cn/quickstart.html"
"troubleshooting.html" = "cn/troubleshooting.html"
"writing.html" = "cn/writing.html"
